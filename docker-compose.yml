name: gisdb_deb

volumes:
  gisdb:

services:
  postgis:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5442:5432
    volumes:
      - gisdb:/var/lib/postgresql
    shm_size: '50g'
    command: >
      postgres -c max_parallel_workers_per_gather=4 -c log_statement=all -c log_destination=stderr
    healthcheck:
      # Try out a healthcheck that checks postgis too:
      # https://github.com/kartoza/docker-postgis/issues/420
      test: psql -U postgres -d postgres -c 'SELECT ST_Buffer( ST_SetSRID(ST_Point(0.0, 0.0)::GEOMETRY, 4326), 1) AS geom;'
      interval: 1s
      # New db connection takes some 300ms for some reason:
      timeout: 1s
      retries: 30
