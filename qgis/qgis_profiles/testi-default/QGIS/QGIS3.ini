news-feed\items\httpsfeedqgisorg\entries\items\144\content="<p>We are looking for an administrative assistant to help us amplify our impact! The QGIS project is largely managed by volunteers who are experiencing increasing administrative workloads as the project grows. To address this, we want to hire an administrative assistant to support our work. Is that something that interests you or someone you know? See our blog for more details!</p><p><strong>Double click here to find out more!</strong></p>"
