news-feed\items\httpsfeedqgisorg\entries\items\138\content="<p>The 2026 QGIS User Conference is coming to Laax, Switzerland, and we'd love your support!&nbsp;</p>\r\n<p>For the first time, our annual QGIS Conference will be held in the Swiss Alps. This community-driven event brings together QGIS users, developers, and contributors from around the world. <strong>If your organisation benefits</strong> from QGIS and wants to <strong>give back</strong>, sponsoring the UC is a great way to do it.</p>\r\n<p>Have a look at our sponsorship brochure for more detail.</p><p><strong>Double click here for more information</strong></p>"
