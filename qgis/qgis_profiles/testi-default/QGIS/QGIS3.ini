news-feed\items\httpsfeedqgisorg\entries\items\143\content="<p>Last call! The QGIS UC2026 Call for Papers closes April 12 at 23:59 (Europe/Zurich). We're looking for talks, workshops, and mini-workshops &ndash; all levels welcome, from end users to developers, academia to industry.</p>\r\n<p>Don't miss your chance to present at Laax this October, submit now!</p><p><strong>Double click here for more information</strong></p>"
