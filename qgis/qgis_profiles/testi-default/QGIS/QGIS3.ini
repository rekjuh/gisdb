news-feed\items\httpsfeedqgisorg\entries\items\142\content="<p>QGIS installers previously included all PROJ reprojection grids&mdash;large TIFF files totaling up to 800 MB, making the full package 1.3 GB. This caused issues for users and high server bandwidth.</p>\r\n<p>Future installers will exclude these grids. QGIS can download missing grids on demand, while full offline installers remain available for those needing offline deployment.</p>"
